<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in · Infrared</title>
  <link rel="stylesheet" href="/css/index.css" />
  <style>
    body { min-height:100vh; display:grid; place-items:center; background:#080808; color:#fff; font-family:Inter,system-ui,sans-serif; }
    .login-card { width:min(420px,calc(100% - 32px)); padding:32px; border:1px solid rgba(255,255,255,.12); border-radius:24px; background:rgba(20,20,20,.92); box-shadow:0 24px 80px rgba(0,0,0,.45); }
    .logo { width:56px; height:56px; object-fit:contain; margin-bottom:22px; }
    h1 { margin:0 0 8px; font-size:28px; } p { color:#999; margin:0 0 24px; }
    label { display:block; color:#aaa; font-size:13px; margin:16px 0 7px; }
    input { width:100%; box-sizing:border-box; border:1px solid #333; border-radius:12px; padding:13px 14px; background:#101010; color:#fff; font-size:15px; outline:none; }
    input:focus { border-color:#e80000; } button { width:100%; margin-top:22px; border:0; border-radius:12px; padding:13px; background:#e80000; color:#fff; font-weight:700; cursor:pointer; }
    button:disabled { opacity:.6; cursor:wait; } .error { min-height:18px; margin-top:14px; color:#ff7373; font-size:13px; }
  </style>
</head>
<body>
  <main class="login-card">
    <img class="logo" src="/assets/logo.webp" alt="Infrared" />
    <h1>Welcome back</h1>
    <p>Sign in to continue to Infrared.</p>
    <form id="loginForm">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required autofocus />
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />
      <button id="submitButton" type="submit">Sign in</button>
      <div class="error" id="error" role="alert"></div>
    </form>
  </main>
  <script src="/js/login.js"></script>
</body>
</html>
